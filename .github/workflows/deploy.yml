name: Deploy to Lightsail

on:
  workflow_dispatch:

jobs:
  ssh-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            whoami
            hostname
            pwd
